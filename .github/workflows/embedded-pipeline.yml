name: Embedded Beginner CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-c:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup GCC Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Compile C Code
      run: |
        mkdir -p build
        gcc src/main.c -o build/firmware_test

  test-python:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Code Checker
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Check Python Syntax Errors
      run: |
        flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
